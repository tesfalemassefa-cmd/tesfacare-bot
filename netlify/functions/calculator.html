<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TesfaCare</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#222)}
  h1{font-size:20px;margin:0 0 8px}
  h2{font-size:16px;margin:20px 0 8px}
  label{display:block;font-size:14px;margin:14px 0 6px}
  select{padding:10px 4px;font-size:15px;border-radius:10px;border:1px solid #bbb;background:var(--tg-theme-secondary-bg-color,#f4f4f5);color:inherit;min-width:0;width:100%}
  .dates{display:flex;gap:6px}
  .dates select{flex:1}
  .three select:nth-child(2){flex:2.4}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:10px 6px;font-size:14px;border-radius:10px;border:1px solid #bbb;background:var(--tg-theme-secondary-bg-color,#f4f4f5);color:inherit}
  .seg button.on{background:var(--tg-theme-button-color,#2a9d8f);color:var(--tg-theme-button-text-color,#fff);border-color:transparent}
  .main{width:100%;margin-top:18px;padding:14px;font-size:16px;border:0;border-radius:10px;background:var(--tg-theme-button-color,#2a9d8f);color:var(--tg-theme-button-text-color,#fff)}
  .gray{background:#888}
  .card{margin-top:12px;padding:12px;border-radius:12px;background:var(--tg-theme-secondary-bg-color,#f4f4f5)}
  .hero{text-align:center}
  .big{font-size:30px;font-weight:700;margin-bottom:4px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 6px;border-bottom:1px solid rgba(128,128,128,.25);font-size:14px}
  .row:last-child{border-bottom:0}
  .row b{text-align:right;font-weight:600}
  .row small{opacity:.7;font-weight:400}
  .past{opacity:.55}
  .cur{background:rgba(42,157,143,.18);border-radius:8px}
  .err{margin-top:14px;color:#c0392b}
  .note{margin-top:14px;font-size:13px;opacity:.75}
</style>
</head>
